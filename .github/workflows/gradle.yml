name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Start application
        run: java -jar artifacts/app-ibank.jar -P:profile=test &

      - name: Run tests
        run: ./gradlew test -Dselenide.browser=chrome -Dselenide.chromeoptions.args=--no-sandbox,--disable-dev-shm-usage